version: '3.8'

# ============================================
# SOS Super MKT — WhatsApp Bot
# Infraestrutura completa com Docker Compose
# ============================================

services:

  # ── BANCO DE DADOS PRINCIPAL ──
  postgres:
    image: postgres:15-alpine
    container_name: sos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: sos_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-senha_segura_troque}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── CACHE E FILAS ──
  redis:
    image: redis:7-alpine
    container_name: sos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── EVOLUTION GO (WHATSAPP API) ──
  evolution:
    image: atendai/evolution-api:latest
    container_name: sos_evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      GLOBAL_API_KEY: ${EVOLUTION_API_KEY:-troque_esta_chave}
      POSTGRES_AUTH_DB: postgresql://postgres:${DB_PASSWORD:-senha_segura_troque}@postgres:5432/evogo_auth
      POSTGRES_USERS_DB: postgresql://postgres:${DB_PASSWORD:-senha_segura_troque}@postgres:5432/evogo_users
      WEBHOOK_URL: http://backend:3000/webhook/evolution
      DATABASE_SAVE_MESSAGES: "true"
      CONNECT_ON_STARTUP: "true"
      MINIO_ENABLED: "true"
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - evolution_data:/evolution/instances

  # ── MINIO (ARMAZENAMENTO DE MÍDIAS) ──
  minio:
    image: minio/minio:latest
    container_name: sos_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── N8N (AUTOMAÇÕES) ──
  n8n:
    image: n8nio/n8n:latest
    container_name: sos_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-senha_n8n_troque}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-senha_segura_troque}
      GENERIC_TIMEZONE: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  # ── BACKEND (NODE.JS + FASTIFY) ──
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sos_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-senha_segura_troque}@postgres:5432/sos_bot
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque_esta_chave_jwt}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque_esta_chave_refresh}
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-troque_esta_chave}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_SANDBOX: ${ASAAS_SANDBOX:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SOS Super MKT <no-reply@seudominio.com.br>}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution:
        condition: service_started
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── FRONTEND (REACT + VITE) ──
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sos_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

# ── VOLUMES PERSISTENTES ──
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  n8n_data:
    driver: local
  evolution_data:
    driver: local

# ── REDE INTERNA ──
networks:
  default:
    name: sos_network
    driver: bridge
