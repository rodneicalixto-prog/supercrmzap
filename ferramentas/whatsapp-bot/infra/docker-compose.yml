version: '3.8'

# ============================================================
# SOS Super MKT — WhatsApp Bot
# Infraestrutura completa com Docker Compose
# Produção: supercrmapi.openwave.online / supercrmapp.openwave.online
# ============================================================

services:

  # ── BANCO DE DADOS PRINCIPAL ──────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sos_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: supercrmzap
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── CACHE E FILAS ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sos_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MINIO (Armazenamento de mídias) ──────────────────────
  minio:
    image: minio/minio:latest
    container_name: sos_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-troque_senha_minio}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # ── N8N (Automações) ──────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    container_name: sos_n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:-troque_senha_n8n}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://n8n:5678
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: postgres
      DB_POSTGRESDB_PASSWORD: ${DB_PASSWORD:-troque_esta_senha}
      GENERIC_TIMEZONE: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

  # ── BACKEND (Node.js + Fastify) ───────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sos_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-troque_esta_senha}@sos_postgres:5432/supercrmzap
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-troque_esta_chave_jwt}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-troque_esta_chave_refresh}
      API_URL: https://supercrmapi.openwave.online
      FRONTEND_URL: https://supercrmapp.openwave.online
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://10.0.2.4:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-troque_esta_chave}
      N8N_WEBHOOK_URL: http://n8n:5678/webhook
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_SANDBOX: ${ASAAS_SANDBOX:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-SOS Super MKT <no-reply@openwave.online>}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-troque_senha_minio}
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: supercrmzap
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.supercrmapi.rule=Host(`supercrmapi.openwave.online`)"
      - "traefik.http.routers.supercrmapi.entrypoints=https"
      - "traefik.http.routers.supercrmapi.tls=true"
      - "traefik.http.routers.supercrmapi.tls.certresolver=letsencrypt"
      - "traefik.http.services.supercrmapi.loadbalancer.server.port=3000"
      - "traefik.docker.network=coolify"

  # ── SCHEDULER (Worker de agendamentos) ───────────────────
  scheduler:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: sos_scheduler
    restart: unless-stopped
    command: ["node", "src/workers/scheduler.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-troque_esta_senha}@sos_postgres:5432/supercrmzap
      EVOLUTION_API_URL: ${EVOLUTION_API_URL:-http://10.0.2.4:8080}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-troque_esta_chave}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - default
      - coolify

  # ── FRONTEND (React + Vite — build de produção) ───────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: sos_frontend
    restart: unless-stopped
    ports:
      - "8282:80"
    environment:
      VITE_API_URL: https://supercrmapi.openwave.online
      VITE_WS_URL: wss://supercrmapi.openwave.online
    depends_on:
      - backend
    networks:
      - default
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.supercrmapp.rule=Host(`supercrmapp.openwave.online`)"
      - "traefik.http.routers.supercrmapp.entrypoints=https"
      - "traefik.http.routers.supercrmapp.tls=true"
      - "traefik.http.routers.supercrmapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.supercrmapp.loadbalancer.server.port=80"
      - "traefik.docker.network=coolify"

# ── VOLUMES PERSISTENTES ──────────────────────────────────
volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  n8n_data:
    driver: local

# ── REDES ─────────────────────────────────────────────────
networks:
  default:
    name: sos_network
    driver: bridge
  coolify:
    external: true
